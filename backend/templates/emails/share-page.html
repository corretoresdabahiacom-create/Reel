<!doctype html>
<html lang="{{lang}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>{{title}}</title>
<style>
:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f2fb;color:#1d1b26;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:16px;box-sizing:border-box}
@media (prefers-color-scheme:dark){body{background:#0f0d16;color:#ece9f7}.card{background:#1b1826!important}.muted{color:#a8a3bd!important}input{background:#0f0d16;color:#ece9f7}}
.card{width:100%;max-width:440px;background:#fff;border-radius:18px;padding:24px;box-sizing:border-box}.brand{font-size:13px;font-weight:700;letter-spacing:.04em;color:#7c3aed}
h1{font-size:20px;margin:10px 0 6px}.muted{color:#55526a;font-size:14px}.msg{border-left:3px solid #c4b5fd;padding:8px 12px;margin:14px 0;white-space:pre-wrap}
.btn{display:block;width:100%;box-sizing:border-box;text-align:center;background:#7c3aed;color:#fff;border:0;border-radius:12px;min-height:48px;padding:12px;font:700 16px/1.5 inherit;text-decoration:none;cursor:pointer;margin-top:16px}
label{display:block;margin-top:16px;font-size:14px;font-weight:600}input{width:100%;box-sizing:border-box;min-height:48px;border:1px solid #c9c4dd;border-radius:12px;padding:10px 12px;font-size:16px;margin-top:6px}
.err{color:#c0262d;font-size:14px;margin-top:10px}
</style></head>
<body><main class="card">
  <div class="brand">NEXUSREEL</div>
  <h1>{{heading}}</h1>
  <div class="muted">{{fileName}} · {{expires}}</div>
  {{#message}}<div class="msg">{{message}}</div>{{/message}}
  {{#error}}<div class="err" role="alert">{{error}}</div>{{/error}}
  {{#needsPassword}}<form method="post" action="{{action}}"><label for="pw">{{passwordLabel}}</label><input id="pw" name="password" type="password" autocomplete="off" required maxlength="64"><button class="btn" type="submit">{{button}}</button></form>{{/needsPassword}}
  {{#direct}}<a class="btn" href="{{action}}">{{button}}</a>{{/direct}}
</main></body></html>
