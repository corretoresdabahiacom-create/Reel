global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alerts.yml, /etc/prometheus/slo-rules.generated.yml]
scrape_configs:
  - job_name: nexus-api
    metrics_path: /metrics
    authorization: { type: Bearer, credentials: dev-metrics-token }
    static_configs: [{ targets: ["api:8787"] }]
  - job_name: nexus-worker
    static_configs: [{ targets: ["worker:9464"] }]
