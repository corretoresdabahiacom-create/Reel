        labels: { sloth_service: "api", sloth_slo: "latency-read" }
      - record: slo:sli_error:ratio_rate6h
        expr: |
          (sum(rate(http_request_duration_seconds_count{method="GET"}[6h])) - sum(rate(http_request_duration_seconds_bucket{method="GET",le="0.3"}[6h]))) / (sum(rate(http_request_duration_seconds_count{method="GET"}[6h])))
        labels: { sloth_service: "api", sloth_slo: "latency-read" }
      - record: slo:sli_error:ratio_rate1d
