<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>NexusReel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%238B5CF6%27/%3E%3Cstop offset=%271%27 stop-color=%27%23EC4899%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M25 20l20 12-20 12z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<style>
/* Conceito de layout: app mobile-first dentro de uma "moldura de celular" (max 480px) com abas inferiores em vidro fosco. */
:root{
  --bg:#000000; --bg2:#0A0A0A; --surface:#131316; --surface2:#1C1C21; --line:rgba(255,255,255,.10);
  --fg:#FFFFFF; --fg2:#A6A6B2; --a1:#8B5CF6; --a2:#EC4899;
  --grad:linear-gradient(135deg,#8B5CF6,#EC4899);
  --ok:#34D399; --err:#F87171; --warn:#FBBF24;
  --font:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
#root{height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--fg)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid #C4B5FD;outline-offset:2px;border-radius:8px}/* sem transition:all em nenhum componente: o anel de foco aparece na hora (WCAG 2.4.7) */
.app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.page{flex:1;min-height:0;position:relative;overflow:hidden}
.scroll{height:100%;overflow-y:auto;overflow-x:hidden;padding:0 16px 28px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tap{transition:transform .25s ease,opacity .25s ease}
.tap:active{transform:scale(.97)}
/* barra inferior */
.tabbar{flex:none;display:flex;align-items:flex-end;justify-content:space-around;padding:8px 6px 6px;background:rgba(10,10,10,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);position:relative;z-index:20}
.tab{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg2);font-size:10.5px;font-weight:600}
.tab[aria-current=page]{color:var(--fg)}
.tab-create{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--fg2)}
.tab-create .fab{width:56px;height:56px;margin-top:-26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(139,92,246,.5),0 0 0 4px var(--bg2)}
.tab-create[aria-current=page]{color:var(--fg)}
/* tipografia e blocos */
.h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--fg2)}
.small{font-size:13px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;min-height:56px}
.top .grow{flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.btn{min-height:50px;border-radius:16px;padding:0 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s ease,opacity .25s ease}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(139,92,246,.3)}
.btn-ghost{background:var(--surface2);color:var(--fg)}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:0 14px;border-radius:14px;font-size:14px}
.card{background:var(--surface);border-radius:20px;padding:16px;border:1px solid var(--line)}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;transition:background-color .25s ease,background .25s ease,border-color .25s ease,color .25s ease,box-shadow .25s ease,transform .25s ease,opacity .25s ease,width .25s ease}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.vs-dot{width:12px;height:12px;border-radius:50%;background:#ef4444;display:inline-block;animation:vsblink 1s steps(2) infinite}@keyframes vsblink{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.vs-dot{animation:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.field{display:flex;flex-direction:column;gap:6px}
.input{width:100%;min-height:48px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .25s}
.input:focus{border-color:var(--a1)}
textarea.input{resize:none;line-height:1.5}
.input.bad{border-color:var(--err)}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff}
.badge-ok{color:var(--ok)}.badge-err{color:var(--err)}
.avatar{border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:600;font-size:14px;color:var(--fg2);transition:background-color .25s,background .25s,border-color .25s,color .25s,box-shadow .25s,transform .25s,opacity .25s,width .25s}
.seg button.on{background:var(--surface2);color:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:14px}
/* skeleton */
.skeleton{background:linear-gradient(100deg,#17171b 30%,#26262d 50%,#17171b 70%);background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
/* onboarding */
.ob{height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0%,#2a1457 0%,#0A0A0A 60%)}
.ob-slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.ob-slides::-webkit-scrollbar{display:none}
.ob-slide{min-width:100%;scroll-snap-align:center;padding:24px 24px 0;display:flex;flex-direction:column;justify-content:center;gap:28px}
.ob-vis{height:250px;display:grid;place-items:center}
.dots{display:flex;gap:6px;justify-content:center;padding:14px}
.dots i{width:7px;height:7px;border-radius:4px;background:#3a3a44;transition:background-color .3s,background .3s,border-color .3s,color .3s,box-shadow .3s,transform .3s,opacity .3s,width .3s}
.dots i.on{width:22px;background:var(--grad)}
.big60{font-size:120px;font-weight:800;letter-spacing:-.05em;line-height:1}
.chain{display:flex;align-items:center;gap:0}
.chain .fr{width:46px;height:82px;border-radius:10px;border:2px solid rgba(255,255,255,.25)}
.chain .ln{width:14px;height:2px;background:var(--grad)}
.plats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:320px}
.plat{width:100%;aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
/* feed */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.feed::-webkit-scrollbar{display:none}
.fitem{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden}
.fblob{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;filter:blur(50px);opacity:.55;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-10%,-6%) scale(1)}to{transform:translate(18%,14%) scale(1.25)}}
.fshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 28%,transparent 50%,rgba(0,0,0,.85) 100%)}
.ftitle{position:absolute;left:24px;right:84px;top:30%;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.03em;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.4)}
.fside{position:absolute;right:10px;bottom:96px;display:flex;flex-direction:column;align-items:center;gap:14px}
.fbtn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;min-width:48px;min-height:48px;justify-content:center;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.fbtn.liked svg{color:#FF3B6B;animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.3)}}
.finfo{position:absolute;left:16px;right:84px;bottom:20px;display:flex;flex-direction:column;gap:8px}
.ftop{position:absolute;top:0;left:0;right:0;padding:12px 16px 0;display:flex;align-items:center;gap:16px;z-index:3;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent)}
.fprog{position:absolute;top:0;left:0;right:0;height:3px;display:flex;gap:3px;padding:0 10px;z-index:4}
.fprog i{flex:1;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;position:relative}
.fprog i b{position:absolute;inset:0;background:#fff;transform-origin:left;animation:fp 12s linear infinite}
@keyframes fp{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* wizard */
.steps{display:flex;gap:5px;padding:0 0 12px}
.steps i{flex:1;height:4px;border-radius:2px;background:#2a2a32}
.steps i.on{background:var(--grad)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:3/4;border-radius:16px;position:relative;overflow:hidden;border:1px solid var(--line)}
.ph .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center}
.ph.add{background:var(--surface);border:1.5px dashed #3b3b46;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--fg2);font-size:12px;font-weight:600}
.ph .n{position:absolute;left:6px;bottom:6px}
.sb{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 10px;margin:0 -16px;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.scard{flex:none;width:62%;aspect-ratio:9/15;border-radius:22px;position:relative;overflow:hidden;scroll-snap-align:center;border:1px solid var(--line)}
.scard .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 35%,rgba(0,0,0,.88))}
.scard .tl{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}
.scard .tx{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.35}
.sk-card{flex:none;width:62%;aspect-ratio:9/15;border-radius:22px}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg2)}
.ring b{position:relative;z-index:1;font-size:26px;font-weight:800}
.node{flex:none;width:34px;height:60px;border-radius:9px;border:2px solid #34343e;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;transition:border-color .3s}
.node.done{border-color:var(--ok)}
.node.active{border-color:var(--a2);animation:pulse 1.1s ease-in-out infinite}
.node.pending{opacity:.45}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(236,72,153,.25)}}
.nline{flex:none;width:10px;height:2px;background:#34343e;align-self:center}
.nline.on{background:var(--grad)}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
/* player */
.player{position:relative;aspect-ratio:9/16;width:100%;max-height:100%;border-radius:24px;overflow:hidden;background:#000;border:1px solid var(--line);margin:0 auto;user-select:none}
.pbg{position:absolute;inset:-6%;animation:kb 8s ease-out both}
@keyframes kb{from{transform:scale(1.02) translate(1%,1%)}to{transform:scale(1.14) translate(-2%,-2%)}}
.pshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.05) 35%,rgba(0,0,0,.7) 100%)}
.pseg{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:3px;z-index:3}
.pseg button{flex:1;height:24px;min-width:24px;display:flex;align-items:center} /* WCAG 2.5.8: alvo mínimo de 24 px */
.pseg button i{display:block;width:100%;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.pseg button i b{display:block;height:100%;background:#fff}
.psub{position:absolute;left:14px;right:14px;bottom:15%;text-align:center;z-index:2;font-weight:800;font-size:22px;line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.psub.classic{font-weight:500;font-size:16px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px;display:inline-block;left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:90%}
.psub.minimal{font-weight:500;font-size:15px;letter-spacing:.02em;opacity:.9}
.psub em{font-style:normal;background:var(--grad);padding:0 6px;border-radius:6px}
.pmeta{position:absolute;left:14px;top:30px;z-index:3;display:flex;gap:6px}
.pwm{position:absolute;right:12px;top:30px;z-index:3;font-weight:800;font-size:13px;opacity:.75;letter-spacing:.02em}
.pplay{position:absolute;inset:0;z-index:2;display:grid;place-items:center;width:100%}
.pplay span{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);display:grid;place-items:center;transition:opacity .25s}
.ptime{position:absolute;bottom:10px;left:14px;right:14px;z-index:3;display:flex;justify-content:space-between;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
/* biblioteca */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -16px}
.thumb{aspect-ratio:9/14;position:relative;overflow:hidden;background:var(--surface);display:block;width:100%}
.thumb .a{position:absolute;top:6px;left:6px}
.thumb .b{position:absolute;bottom:6px;left:6px;right:6px;font-size:11.5px;font-weight:700;line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.thumb .s{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.8))}
/* publicar */
.pf{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;transition:border-color .25s}
.pf.on{border-color:rgba(139,92,246,.6)}
.pf.err{border-color:rgba(248,113,113,.6)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid #4a4a56;display:grid;place-items:center;flex:none;transition:background-color .2s,background .2s,border-color .2s,color .2s,box-shadow .2s,transform .2s,opacity .2s,width .2s}
.check.on{background:var(--grad);border-color:transparent}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid #3a3a44;border-top-color:var(--a2);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.pcover{flex:none;width:64px;aspect-ratio:9/14;border-radius:12px;border:2px solid transparent;overflow:hidden;position:relative}
.pcover.on{border-color:var(--a2)}
.sec{display:flex;flex-direction:column;gap:12px;padding:14px}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h .sn{width:28px;height:28px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.sec-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}.sec-tile{flex:0 0 auto;width:64px;height:88px;border-radius:12px;border:2px solid var(--line,#2a2a30);background:var(--card);position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 6px;font-size:11px}.sec-tile i{position:absolute;inset:0;opacity:.85}.sec-tile b,.sec-tile span{position:relative;text-shadow:0 1px 3px #000}.sec-tile b{font-size:18px}.sec-tile.on{border-color:var(--a2,#c084fc);box-shadow:0 0 0 2px var(--a2,#c084fc) inset}.sec-tile.add{background:transparent;border-style:dashed;justify-content:center;gap:2px;color:var(--fg2)}
.sec-meter{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}.sec-meter i{display:block;height:100%;background:var(--grad);transition:width .2s}.sec-meter.full i{background:var(--warn)}
.fv{position:relative;height:min(56vh,640px);aspect-ratio:9/16;max-width:100%;margin:0 auto;border-radius:16px;overflow:hidden;background:#000}
.fv video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.fv-play{position:absolute;left:0;right:0;top:0;bottom:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.30);color:#fff;font-weight:700;font-size:13px}
.fv-play span{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.94);color:#111;display:grid;place-items:center}
.fv-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;background:rgba(0,0,0,.8);font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.more{border:1px solid var(--line);border-radius:14px;padding:4px 12px}details.more summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer;color:var(--fg2)}details.more[open] summary{margin-bottom:8px}details.more .btn{margin-bottom:8px}
/* overlays */
.overlay{position:absolute;inset:0;z-index:40;background:var(--bg2);display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet-bg{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:80%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:18px 16px 24px;animation:up .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:12px}
.sheet>*,.ob>*{flex-shrink:0} /* conteúdo não é esmagado nem sobreposto: a folha rola */
.grab{width:40px;height:4px;border-radius:2px;background:#44444e;margin:-6px auto 4px}
.plan{border-radius:22px;padding:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.plan.hot{border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li svg{color:var(--ok);flex:none;margin-top:2px}
.price{font-size:32px;font-weight:800;letter-spacing:-.02em}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.tcard .cv{aspect-ratio:9/12;position:relative;display:flex;align-items:flex-end;padding:10px}
.tcard .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.toast{position:absolute;top:12px;left:16px;right:16px;z-index:60;display:flex;justify-content:center;pointer-events:none;animation:drop .3s cubic-bezier(.2,.8,.2,1)}
.toast div{background:rgba(32,32,38,.88);backdrop-filter:blur(18px);border:1px solid var(--line);padding:11px 16px;border-radius:22px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@keyframes drop{from{transform:translateY(-24px);opacity:0}}
.stat{flex:1;background:var(--surface);border-radius:18px;padding:12px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:22px;font-weight:800}
.bar{height:6px;border-radius:3px;background:#26262d;overflow:hidden;flex:none}
.bar b{display:block;height:100%;background:var(--grad);transition:width .15s linear}
.inp{display:flex;align-items:center;gap:6px}
.inp .op{color:var(--fg2);flex:none;display:grid;place-items:center;width:16px;font-weight:700}
.tile{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;text-align:center;color:var(--fg2);line-height:1.25}
.tile i{display:block;width:100%;aspect-ratio:9/13;border-radius:12px;border:1px solid var(--line);position:relative;overflow:hidden}
.tile .tcenter{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.tile .fillp{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(139,92,246,.8),rgba(236,72,153,.35));transition:height .15s linear;text-decoration:none}
.mosaic{display:grid!important;grid-template-columns:1fr 1fr;gap:2px;background:#000}
.mosaic b{display:block}
.tl-item{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;min-height:44px}
.tl-item i{display:grid;place-items:center;width:100%;aspect-ratio:9/14;border-radius:10px;border:1px solid var(--line);position:relative}
.tl-item .dot{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.overlay>.scroll{flex:1;min-height:0;height:auto}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.icard{flex:none;width:76%;scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.imood{position:relative;aspect-ratio:4/4.2;overflow:hidden}
.mood{position:absolute;inset:0}
.mood svg{width:100%;height:100%;display:block}
.sentph{position:absolute;right:8px;bottom:8px;width:56px;height:70px;border-radius:12px;border:2px solid #fff}
.ibody{padding:12px;display:flex;flex-direction:column;gap:8px}
.pill2{font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--surface2);color:var(--fg);flex:none}
.diag{background:#050507;border:1px solid var(--line);border-radius:14px;padding:10px;font:11.5px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#B8B8C4;max-height:200px;overflow:auto}
.diag b{color:#C4B5FD;font-weight:600}.diag em{font-style:normal;color:#F9A8D4}
.vt{display:flex;flex-direction:column}
.vt-row{display:flex;gap:12px;min-height:76px}
.vt-rail{display:flex;flex-direction:column;align-items:center;flex:none;width:34px}
.rg{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;background:#26262d;color:var(--fg2)}
.rg::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg2)}
.rg>span{position:relative;z-index:1;display:grid;place-items:center}
.rg small{font-size:10px;font-weight:700}
.rg.done{background:var(--ok);color:var(--ok)}
.rg.error{background:var(--err);color:var(--err)}
.rg.generating{color:#fff}
.vt-line{width:2px;flex:1;background:#2c2c34;margin:2px 0}
.vt-line.on{background:var(--grad)}
.vt-body{flex:1;min-width:0;padding-bottom:14px;display:flex;flex-direction:column;gap:3px}
.vt-thumb{flex:none;width:34px;height:54px;border-radius:8px;border:1px solid var(--line);position:relative;overflow:hidden;transition:opacity .3s}
.vt-thumb .pill{font-size:7.5px;padding:1px 4px;position:absolute;left:2px;bottom:2px}
.switch{width:52px;height:32px;border-radius:16px;background:#3a3a44;position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;inset:-6px}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s}
.switch.on{background:var(--a1)}
.switch.on i{transform:translateX(20px)}
.biz{--a1:#3B82F6;--a2:#8B5CF6;--grad:linear-gradient(135deg,#3B82F6,#8B5CF6)}
.bdg{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.bdg.ok{background:rgba(52,211,153,.15);color:#34D399}.bdg.warn{background:rgba(251,191,36,.15);color:#FBBF24}.bdg.err{background:rgba(248,113,113,.15);color:#F87171}.bdg.idle{background:#2a2a32;color:#A6A6B2}.bdg.info{background:rgba(96,165,250,.15);color:#60A5FA}
.tcards{display:flex;flex-direction:column;gap:10px}
.tcrd{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tr2{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13.5px}
.tr2 .tv{text-align:right;min-width:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:10px 12px;color:var(--fg2);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{font-weight:600;color:inherit;min-height:32px}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:22px;letter-spacing:-.01em}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 12px}
.empty .ill{width:76px;height:76px;border-radius:24px;background:var(--grad);display:grid;place-items:center}
.wsteps{display:flex;gap:6px;margin-bottom:14px}
.ws{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--fg2)}
.ws i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#2a2a32;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.ws.on i{background:var(--grad)}.ws.on{color:var(--fg)}.ws.done i{background:var(--ok);color:#04210f}
.banner{width:100%;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:120px;justify-content:flex-end;color:#fff}
.selcard{border-color:var(--a1)}
.btn-danger{background:#7F1D1D;color:#fff}
@media (min-width:900px){.app.wide{max-width:1180px}.app.wide .kgrid{grid-template-columns:repeat(4,1fr)}.app.wide .scroll{padding:0 28px 28px}.app.wide .tgrid.g4{grid-template-columns:repeat(4,1fr)}}
.pubdots{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:5px;z-index:2}
.pubdots i{display:block;width:14px;height:14px;border-radius:5px}
.val{font-size:12.5px;line-height:1.35;display:flex;gap:6px;align-items:flex-start}
.val svg{flex:none;margin-top:2px}
.bigcheck{width:76px;height:76px;border-radius:50%;background:var(--grad);display:grid;place-items:center;animation:popin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-24px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(600deg);opacity:.2}}
.ptime{align-items:center;gap:8px}
.ptime input{flex:1;min-width:0;accent-color:#EC4899;height:28px}
.ptime button{width:32px;height:32px;display:grid;place-items:center;flex:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---------------- Fase 5 ---------------- */
.banners{flex:none}
.banner{padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.banner.off{background:#3a2a05;color:#FBBF24}
.banner.sync{background:#10281f;color:var(--ok)}
.banner.del{background:#3b1010;color:#fecaca}
.langchips{display:flex;gap:6px}
.langchips .chip{min-height:36px;padding:0 12px}
pre.dbg{margin:0;padding:10px;background:#0b0b0e;border:1px solid var(--line);border-radius:12px;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;white-space:pre-wrap;word-break:break-all;max-height:55vh;overflow:auto}
.ic-dir{display:inline-block}
[dir=rtl] .ic-dir{transform:scaleX(-1)}
[dir=rtl] .top,[dir=rtl] .row,[dir=rtl] .tabbar,[dir=rtl] .chips{direction:rtl}
[dir=rtl] .switch i{left:auto;right:3px}
[dir=rtl] .switch.on i{transform:translateX(-20px)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* safe areas (Capacitor / PWA instalado) */
.tabbar{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.app{padding-top:env(safe-area-inset-top,0px)}
/* ---------- Módulo 1: aba de áudio (só aparece com ff_audio) ---------- */
.aud-range{display:grid;grid-template-columns:minmax(64px,auto) 1fr 44px;align-items:center;gap:10px;min-height:44px}
.aud-range input[type=range]{width:100%;min-height:44px;margin:0;accent-color:var(--a1);cursor:pointer;background:transparent}
.aud-range input[type=range]:focus-visible{outline:2px solid var(--a1);outline-offset:4px;border-radius:8px}
.aud-range output{font-variant-numeric:tabular-nums;text-align:end;font-size:13px;color:var(--fg2)}
.aud-sw{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.aud-sw input[type=checkbox]{width:44px;height:26px;margin:0;flex:none;accent-color:var(--a1);cursor:pointer}
.aud-sw input[type=checkbox]:not([switch]),.aud-sw input[type=checkbox][switch]{appearance:none;-webkit-appearance:none;border-radius:13px;background:#3a3a44;position:relative;transition:background .2s}
.aud-sw input[type=checkbox]::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.aud-sw input[type=checkbox]:checked{background:var(--a1)}
.aud-sw input[type=checkbox]:checked::after{transform:translateX(18px)}
[dir=rtl] .aud-sw input[type=checkbox]:checked::after{transform:translateX(-18px)}
.aud-sw input[type=checkbox]:focus-visible{outline:2px solid var(--a1);outline-offset:3px}
.aud-sw input[type=checkbox]:disabled{opacity:.45;cursor:not-allowed}
.aud-track{display:flex;align-items:center;gap:10px;min-height:52px;width:100%;text-align:start;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.aud-track[aria-checked=true]{border-color:var(--a1);background:rgba(139,92,246,.14)}
.aud-play{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.aud-steps{display:flex;flex-wrap:wrap;gap:4px}
.aud-note{border-color:rgba(139,92,246,.45)!important}
@media (prefers-reduced-motion:reduce){.aud-sw input[type=checkbox],.aud-sw input[type=checkbox]::after{transition:none}}
/* ---------- Módulo 2: editor de fundo (só aparece com ff_background) ---------- */
.bg-stage{position:relative;width:100%;max-width:300px;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--surface)}
.bg-layer{position:absolute;inset:0}
.bg-box{position:relative;width:100%;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--surface2)}
.bg-box>.bg-pane{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.bg-box .bg-stage{height:100%;width:auto;max-width:100%;border-radius:0}
.bg-check{background-color:#2a2a31;background-image:linear-gradient(45deg,#3a3a44 25%,transparent 25%,transparent 75%,#3a3a44 75%),linear-gradient(45deg,#3a3a44 25%,transparent 25%,transparent 75%,#3a3a44 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.bg-subject{position:absolute;inset:18% 22% 14%;border-radius:46% 46% 38% 38%;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 58%,rgba(0,0,0,.55) 66%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 50%,#000 58%,rgba(0,0,0,.55) 66%,transparent 72%)}
.bg-extend{position:absolute;inset:-12%;filter:blur(18px) brightness(.9)}
.bg-tag{position:absolute;top:8px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff}
.bg-compare{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;min-height:44px}
.bg-compare input[type=range]{width:100%;min-height:44px;margin:0;accent-color:var(--a1);cursor:pointer;background:transparent}
.bg-compare input[type=range]:focus-visible{outline:2px solid var(--a1);outline-offset:4px;border-radius:8px}
.bg-ver{display:flex;align-items:center;gap:10px;min-height:56px;width:100%;text-align:start;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.bg-ver[aria-checked=true]{border-color:var(--a1);background:rgba(139,92,246,.14)}
.bg-ver i{width:32px;height:44px;border-radius:8px;flex:none;position:relative;overflow:hidden}
/* ---------- Módulo 3: inserção de elementos (só aparece com ff_elements) ---------- */
.el-item{position:absolute;transform:translate(-50%,-50%);aspect-ratio:3/4;box-shadow:6px 10px 14px rgba(0,0,0,.35)}
.el-item[data-eltype=person]{aspect-ratio:2/5;border-radius:40% 40% 18% 18%}
.el-item[data-eltype=animal]{aspect-ratio:1/1;border-radius:46%}
.el-item[data-eltype=object]{border-radius:14%}
.el-tint{position:absolute;mix-blend-mode:color;border-radius:6px}
.el-erase{position:absolute;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);background:rgba(40,40,48,.35);border-radius:6px}
.el-stage{cursor:crosshair;touch-action:manipulation}
.el-grid{display:grid;grid-template-columns:repeat(3,44px);gap:6px}
.el-grid button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.el-grid button[aria-pressed=true]{background:var(--grad);border-color:transparent}
.el-swatch{width:44px;height:44px;border-radius:50%;border:2px solid transparent;flex:none}
.el-swatch[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--a1)}
/* ---------- Módulo 4: união de vídeos (só aparece com ff_merge) ---------- */
.mg-item{display:flex;align-items:center;gap:12px;min-height:64px;width:100%;text-align:start;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.mg-item[aria-checked=true]{border-color:var(--a1);background:rgba(139,92,246,.14)}
.mg-item:disabled{opacity:.5;cursor:not-allowed}
.mg-item i{width:36px;height:52px;border-radius:8px;flex:none}
.mg-pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mg-pair .mg-thumb{aspect-ratio:9/16;border-radius:12px;max-height:150px;width:100%}
/* ---------- Módulo 5: salvamento (só aparece com ff_save) ---------- */
.sv-opt{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;text-align:start;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.sv-opt:disabled{opacity:.5;cursor:not-allowed}
.sv-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);flex:none}
.sv-dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-style:normal;font-size:14px}
.sv-list{margin:0;padding-inline-start:18px;display:grid;gap:4px}
.pill2.on{background:var(--grad);color:#fff}
/* ---------- Módulo 6: assets derivados (só aparece com ff_assets) ---------- */
.as-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.as-type{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:72px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-align:center}
.as-type[aria-checked=true]{border-color:var(--a1);background:rgba(139,92,246,.14)}
#as-opts .chips{flex-wrap:wrap;overflow:visible}
/* ---------- Módulo 7: envio por e-mail (só aparece com ff_email) ---------- */
.em-chips{display:flex;flex-wrap:wrap;gap:6px}
.em-chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:4px 4px 4px 10px;border-radius:999px;background:var(--surface2);font-size:13px;overflow-wrap:anywhere}
.em-chip button{display:grid;place-items:center;min-width:32px;min-height:32px;border-radius:50%;color:var(--fg)}
/* ---------- Módulo 8: colaboração + timeline (só aparece com ff_collaboration / ff_timeline) ---------- */
.cl-avatars{display:flex;padding-inline-start:6px}
.cl-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;margin-inline-start:-6px;border:2px solid var(--surface);opacity:.55}
.cl-av.on{opacity:1;box-shadow:0 0 0 2px var(--ok)}
.tl-track{display:grid;gap:4px}
.tl-head{display:flex;align-items:center;gap:6px;min-width:0}
.tl-head>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-tog{min-width:32px;min-height:32px;border-radius:8px;border:1px solid var(--line);font-size:12px;background:var(--surface);color:var(--fg)}
.tl-tog.on{background:#6D28D9;color:#fff;border-color:transparent}
.tl-tog:disabled{opacity:.45}
.tl-lane{position:relative;height:44px;border-radius:8px;background:var(--surface2);overflow:hidden}
.tl-clip{position:absolute;top:4px;bottom:4px;border-radius:6px;background:rgba(139,92,246,.55);background-size:cover;border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;overflow:hidden;padding:0 4px;text-align:start;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tl-clip.sel{outline:2px solid #fff;z-index:2}
.tl-clip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tl-play,.tl-cursor{position:absolute;top:0;bottom:0;width:2px;z-index:3;pointer-events:none}
.tl-play{background:#fff}.tl-cursor{background:#0ea5e9}
#tl-play{width:100%}
/* ---------- Módulo 9: transcrição + agente (só aparece com ff_transcript / ff_agent) ---------- */
.tx-words{display:flex;flex-wrap:wrap;gap:4px;line-height:1.3}
.tx-w{min-height:40px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:15px;max-width:100%;overflow-wrap:anywhere}
.tx-w.sel{background:#6D28D9;color:#fff;border-color:transparent}
.tx-w.cut{text-decoration:line-through;opacity:.45}
.tx-w.rep{text-decoration:line-through;opacity:.6}
.tx-new{display:inline-flex;align-items:center;min-height:40px;padding:4px 8px;border-radius:8px;background:rgba(16,185,129,.18);color:var(--fg);font-size:15px;font-weight:600}
.tx-prev{display:flex;gap:10px;align-items:center}
.tx-thumb{width:54px;height:96px;border-radius:8px;background:linear-gradient(160deg,var(--a1),#0ea5e9);display:grid;place-items:center;color:#fff;flex:none}
.ag-steps{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.ag-hist{display:grid;gap:6px}
.ag-hist>div{display:flex;gap:8px;align-items:center;min-width:0}
.ag-hist>div>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- Módulo 10: insights + séries + selo + live (só aparece com ff_insights / ff_series / ff_seal / ff_live) ---------- */
.in-est{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(245,158,11,.18);color:var(--fg);font-size:12px;font-weight:700;letter-spacing:.02em}
.in-meter{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.in-meter>b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--a1),#0ea5e9)}
.in-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.se-ep{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:start}
.se-n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#6D28D9;color:#fff;font-weight:700;font-size:13px}
.se-tools{display:flex;gap:6px;flex-wrap:wrap}

.lv-ai{position:absolute;top:10px;inset-inline-start:10px;background:#f59e0b;color:#111;font-weight:800;font-size:13px;padding:3px 8px;border-radius:6px;z-index:2}
.lv-disc{position:absolute;top:44px;inset-inline:10px;background:rgba(0,0,0,.72);border-radius:10px;padding:8px;font-size:12px;line-height:1.35;z-index:2}

.cap-prev{border-radius:12px;padding:14px;background:#000;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:84px;align-items:center}
.cap-prev span{font-weight:700;padding:2px 4px;border-radius:4px;transition:background .15s,color .15s}

.tp-bar button{min-height:44px;min-width:44px}
.tp-count{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:800;z-index:3;background:rgba(0,0,0,.6)}
.tp-rec{position:absolute;top:12px;inset-inline-end:12px;z-index:3;background:#b91c1c;color:#fff;font-weight:700;padding:4px 10px;border-radius:999px}
.tp-cam{position:absolute;bottom:12px;inset-inline-end:12px;width:96px;height:128px;border-radius:10px;background:#111;object-fit:cover;z-index:3;border:2px solid #fff}
.tp-range{width:100%;min-height:44px}
