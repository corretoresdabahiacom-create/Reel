/** Publica em UMA plataforma. Isolada: nunca lança exceção, só marca o job como failed. */
async function publishJob(app, project, video, p, m, auto) {
  const { dispatch, get } = app;
  const id = project.id + ":" + p.id;
  const prev = get().jobs.find((j) => j.id === id);
  const retryCount = prev && prev.status === "failed" ? prev.retryCount + 1 : 0;
  const set = (patch) => dispatch({ type: "job", job: { id, projectId: project.id, platform: p.id, retryCount, auto: !!auto, ...patch } });
  const fail = (msg, code) => {
    set({ status: "failed", progress: 0, stage: null, error: msg });
    dispatch({ type: "addPub", pub: { id: uid(), projectId: project.id, platform: p.id, status: "error", externalUrl: null, error: msg, publishedAt: nowISO(), locale: video.locale || project.sourceLocale || "pt-BR" } });
    ilog(p.id, "publish_failed", { code, retryCount });
    return false;
  };
  if (!flagOn(get(), "publish_" + p.id)) return fail(tr("maint.publish", { platform: p.name }), "kill_switch");
  set({ status: "pending", progress: 0.02, stage: "Verificando conta", error: null, externalUrl: null, locale: video.locale || project.sourceLocale || "pt-BR" });
  await sleep(120);
  let acc = get().accounts.find((a) => a.platform === p.id);
  if (!acc || acc.status !== "connected") return fail("Conta não conectada ou expirada. Reconecte em Contas conectadas.", "not_connected");
  try {
    const integ = INTEGRATIONS[p.id];
    if (acc.expiresAt - Date.now() < 60000) {
      set({ stage: "Renovando acesso" }); ilog(p.id, "token_refresh", {});
      const t = await integ.refresh(acc);
      acc = { ...acc, ...t, lastSyncAt: nowISO() };
      dispatch({ type: "updateAccount", platform: p.id, patch: { accessToken: t.accessToken, expiresAt: t.expiresAt, lastSyncAt: nowISO() } });
    }
    ilog(p.id, "publish_start", { video: video.durationSec + "s/" + video.sizeMB + "MB" });
    let r;
    try {
      r = await breakerFor("pub:" + p.id, { failureThreshold: 4, openMs: 20000 }).exec(async () => {
        if (FAULT.publish === p.id) throw new Error("503 injetado (debug)");
        const rr = await integ.publish(video, m, acc, (progress, stage) => set({ status: progress < 0.3 ? "uploading" : "processing", progress, stage }));
        if (rr.status !== "success") { const er = new Error(rr.error || "Erro desconhecido."); er.result = rr; throw er; }
        return rr;
      });
    } catch (e) {
      if (e instanceof CircuitOpenError) return fail(tr("breaker.open", { platform: p.name, s: Math.ceil(e.retryAfterMs / 1000) }), "circuit_open");
      if (e.result) r = e.result; else throw e;
    }
    if (r.status !== "success") return fail(r.error || "Erro desconhecido.", "platform_error");
    const pubId = uid();
    set({ status: "published", progress: 1, stage: "Publicado", externalUrl: r.url, error: null, pubId });
    dispatch({ type: "addPub", pub: { id: pubId, projectId: project.id, platform: p.id, status: "success", externalUrl: r.url, error: null, publishedAt: nowISO(), locale: video.locale || project.sourceLocale || "pt-BR" } });
    if (p.affiliate && m.affiliate && flagOn(get(), "affiliates_enabled")) {
      const orig = /^https:\/\//.test((m.affUrl || "").trim()) ? m.affUrl.trim() : genAffLink(p.id, pubId + project.id);
      dispatch({ type: "upd", fn: (s) => ({ affLinks: [{ id: uid(), publicationId: pubId, userId: s.user.id, platform: p.id, originalUrl: orig, trackingUrl: trackUrl(pubId), priceCents: Math.round((parseFloat(String(m.price).replace(",", ".")) || 0) * 100), clicks: 0, conversions: 0, commissionCents: 0, monthCents: 0, feeCents: 0, status: "active" }, ...s.affLinks] }) });
      ilog(p.id, "affiliate_link_created", {});
    }
    dispatch({ type: "updateAccount", platform: p.id, patch: { lastSyncAt: nowISO() } });
    if (p.id === "youtube") dispatch({ type: "yt" });
    ilog(p.id, "publish_ok", {});
    return true;
  } catch (e) { return fail("Falha inesperada em " + p.name + ". Tente novamente.", "exception"); }
}
/** Publica em várias plataformas em paralelo; a falha de uma não afeta as outras. A OLX espera o YouTube (envio automático se preciso). */
async function publishChain(app, project, video, ids, metaOf, videoOf) {
  const byId = (id) => PLATFORMS.find((x) => x.id === id), vOf = (id) => (videoOf ? videoOf(id) : video);
  await Promise.all(ids.filter((id) => id !== "olx").map((id) => publishJob(app, project, vOf(id), byId(id), metaOf(id), false)));
  if (ids.includes("olx")) {
    const jid = project.id + ":youtube";
    await sleep(40);
    let yt = app.get().jobs.find((j) => j.id === jid);
    if (!yt || yt.status !== "published") {
      await publishJob(app, project, vOf("youtube"), byId("youtube"), metaOf("youtube"), !ids.includes("youtube"));
      await sleep(40);
      yt = app.get().jobs.find((j) => j.id === jid);
    }
    if (yt && yt.status === "published") await publishJob(app, project, vOf("olx"), byId("olx"), { ...metaOf("olx"), youtubeUrl: yt.externalUrl }, false);
    else app.dispatch({ type: "job", job: { id: project.id + ":olx", projectId: project.id, platform: "olx", status: "failed", progress: 0, stage: null, error: "Depende do YouTube: o envio automático falhou. Tente de novo.", retryCount: 0 } });
  }
}

              ${p.id === "youtube" && html`${Field({ id: p.id, k: "desc", label: "Descrição", p, multi: true })}${Sel({ id: p.id, k: "visibility", label: "Visibilidade", opts: [["public", "Pública"], ["unlisted", "Não listada"], ["private", "Privada"]] })}

              ${(p.id === "tiktok" || p.id === "instagram") && html`${Field({ id: p.id, k: "caption", label: "Legenda", p, multi: true })}`}

                <div className="field" style=${{ width: 120 }}>${Field({ id: p.id, k: "price", label: "Preço (R$)", p, ph: "0,00", type: "number" })}</div></div>`}
              ${p.affiliate && html`<button className="row tap" style=${{ gap: 10, textAlign: "left", minHeight: 44 }} onClick=${() => setField(p.id, "affiliate", !m.affiliate)} aria-pressed=${m.affiliate}><span className=${"check " + (m.affiliate ? "on" : "")}>${m.affiliate && html`<${Icon} n="check" size=${16} sw=${3} />`}</span><span className="small"><b>Incluir meu link de afiliado</b><br /><span className="muted">O NexusReel acompanha as vendas e retém uma pequena parte da comissão.</span></span></button>`}

              ${j && j.status === "failed" && html`<div className="row"><p className="small badge-err" style=${{ flex: 1 }}>${j.error}${j.retryCount > 0 ? " (tentativa " + (j.retryCount + 1) + ")" : ""}</p><button className="btn btn-ghost btn-sm" disabled=${running} onClick=${() => retry(p)}><${Icon} n="refresh" size=${16} /> Tentar de novo</button></div>`}
            </div>`}
          </div>`; })}
      </div>
      <button className="btn btn-primary btn-block" style=${{ marginTop: 16 }} disabled=${chosen.length === 0 || running} onClick=${publishAll}>${running ? html`<span className="spin"></span>` : html`<${Icon} n="send" size=${18} />`} Publicar em ${chosen.length === PLATFORMS.length ? "todas" : chosen.length + " plataforma" + (chosen.length === 1 ? "" : "s")}</button>
      <button className="btn btn-ghost btn-block" style=${{ marginTop: 10 }} onClick=${() => setSel(chosen.length === PLATFORMS.length ? {} : Object.fromEntries(PLATFORMS.map((p) => [p.id, true])))}>${chosen.length === PLATFORMS.length ? "Desmarcar todas" : "Marcar todas"}</button>
      </div>`}
    </div>`;
}

/** Tabela responsiva: cards no celular; tabela com colunas ordenáveis no desktop (≥900px). Coluna: {k,label,v(row) p/ ordenar,r(row) p/ renderizar} */
function Tbl({ cols, rows, rowKey, empty }) {
  const wide = useWide();
  const [sort, setSort] = useState(null);
  let data = rows;
  if (sort) { const c = cols.find((x) => x.k === sort.k); data = rows.slice().sort((a, b) => { const va = c.v(a), vb = c.v(b); return (va > vb ? 1 : va < vb ? -1 : 0) * sort.d; }); }
  if (!data.length) return empty || null;
  const cell = (c, r) => (c.r ? c.r(r) : c.v(r));
  if (!wide) return html`<div className="tcards">${data.map((r) => html`<div className="tcrd" key=${rowKey(r)}>${cols.map((c) => html`<div className="tr2" key=${c.k}><span className="muted">${c.label}</span><span className="tv">${cell(c, r)}</span></div>`)}</div>`)}</div>`;
  return html`<div className="tblwrap"><table className="tbl"><thead><tr>${cols.map((c) => html`<th key=${c.k} scope="col" aria-sort=${sort && sort.k === c.k ? (sort.d > 0 ? "ascending" : "descending") : "none"}>${c.v && !c.nosort ? html`<button onClick=${() => setSort(sort && sort.k === c.k ? { k: c.k, d: -sort.d } : { k: c.k, d: 1 })}>${c.label}${sort && sort.k === c.k ? (sort.d > 0 ? " ▲" : " ▼") : ""}</button>` : c.label}</th>`)}</tr></thead>
    <tbody>${data.map((r) => html`<tr key=${rowKey(r)}>${cols.map((c) => html`<td key=${c.k}>${cell(c, r)}</td>`)}</tr>`)}</tbody></table></div>`;
}
/** Mini gráfico de linha em SVG puro. series: [{data:number[], color, label}] */
function LineChart({ series: ss, h = 90, label }) {
  const W = 300, n = Math.max(...ss.map((s) => s.data.length)), max = Math.max(1, ...ss.flatMap((s) => s.data));
  const pt = (s, i) => [(i / Math.max(1, n - 1)) * W, h - 6 - (s.data[i] / max) * (h - 16)];
  return html`<div><svg viewBox=${"0 0 " + W + " " + h} width="100%" height=${h} role="img" aria-label=${label || "Gráfico"} preserveAspectRatio="none">
    ${[0.25, 0.5, 0.75].map((f) => html`<line key=${f} x1="0" x2=${W} y1=${h * f} y2=${h * f} stroke="#fff" strokeOpacity=".07" />`)}
    ${ss.map((s, k) => { const d = s.data.map((_, i) => pt(s, i)); const line = d.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" "); const last = d[d.length - 1];
      return html`<g key=${k}>${k === 0 && html`<path d=${line + " L" + W + " " + h + " L0 " + h + " Z"} fill=${s.color} fillOpacity=".12" />`}<path d=${line} fill="none" stroke=${s.color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke" /><circle cx=${last[0]} cy=${last[1]} r="3.5" fill=${s.color} /></g>`; })}</svg>
    ${ss.length > 1 && html`<div className="row small muted" style=${{ gap: 14 }}>${ss.map((s) => html`<span key=${s.label} className="row" style=${{ gap: 6 }}><i style=${{ width: 10, height: 10, borderRadius: 3, background: s.color, display: "inline-block" }}></i>${s.label}</span>`)}</div>`}</div>`;
}

function Marketplace() {
  const app = useApp();
  const { state, dispatch } = app;
  const [cat, setCat] = useState("Todos");
  const [price, setPrice] = useState("all");
  const [sort, setSort] = useState("popular");
  const [q, setQ] = useState("");
  const [loading, setLoading] = useState(true);
  useEffect(() => { const id = setTimeout(() => setLoading(false), 500); return () => clearTimeout(id); }, []);
  if (!isOn(state, "marketplace_enabled")) return html`<${Empty} icon="tag" title="Marketplace indisponível" text="O administrador desativou o marketplace temporariamente." />`;
  const ql = q.trim().toLowerCase();
  let list = state.templates.filter((t) => t.moderationStatus === "approved")
    .filter((t) => cat === "Todos" || t.category === cat)
    .filter((t) => price === "all" || (price === "free" ? t.priceCredits === 0 : t.priceCredits > 0))
    .filter((t) => !ql || t.name.toLowerCase().includes(ql) || t.tags.some((x) => x.toLowerCase().includes(ql)));
  list = list.slice().sort((a, b) => (sort === "popular" ? b.usageCount - a.usageCount : sort === "rating" ? b.ratingAvg - a.ratingAvg : b.createdAt.localeCompare(a.createdAt)));
  const featured = state.templates.find((t) => t.featured && t.moderationStatus === "approved");
  const open = (t) => dispatch({ type: "overlay", overlay: { type: "tpl", id: t.id } });
  return html`<div>
    ${featured && html`<button className="banner tap" onClick=${() => open(featured)} style=${{ background: GRADS[featured.g] }}><span className="pill">Patrocinado · em alta</span><b style=${{ fontSize: 18 }}>${featured.name}</b><span className="small">${featured.usageCount} usos · ${featured.ratingAvg} ★</span></button>`}
    <div className="field" style=${{ margin: "12px 0 8px" }}><label className="label" htmlFor="tpl-q">Buscar</label><input id="tpl-q" className="input" placeholder="Nome ou tag (ex.: skincare)" value=${q} onChange=${(e) => setQ(e.target.value)} /></div>
    <div className="chips" data-noswipe>${["Todos", ...TPL_CATS].map((c) => html`<button key=${c} className=${"chip tap " + (cat === c ? "on" : "")} onClick=${() => setCat(c)}>${c}</button>`)}</div>
    <div className="chips" data-noswipe>${[["all", "Todos os preços"], ["free", "Gratuitos"], ["paid", "Pagos"]].map(([k, l]) => html`<button key=${k} className=${"chip tap " + (price === k ? "on" : "")} onClick=${() => setPrice(k)}>${l}</button>`)}${[["popular", "Mais usados"], ["recent", "Recentes"], ["rating", "Melhor avaliados"]].map(([k, l]) => html`<button key=${k} className=${"chip tap " + (sort === k ? "on" : "")} onClick=${() => setSort(k)}>${l}</button>`)}</div>
    ${loading ? html`<div className="tgrid">${[0, 1, 2, 3].map((k) => html`<div key=${k} className="skeleton" style=${{ height: 230 }}></div>`)}</div>`
      : list.length === 0 ? html`<${Empty} icon="tag" title="Nenhum template encontrado" text="Tente outro filtro ou busca." />`
      : html`<div className="tgrid g4">${list.map((t) => html`<${TplCard} key=${t.id} t=${t} owned=${t.priceCredits > 0 && owns(state, state.user.id, t)} onOpen=${() => open(t)} />`)}</div>`}
    <p className="muted small" style=${{ textAlign: "center", marginTop: 16 }}>Criadores Pro vendem templates aqui. O NexusReel retém ${state.settings.marketplaceFeePct}% e o criador recebe o restante em créditos.</p></div>`;
}

function TemplateDetail({ id }) {
  const app = useApp();
  const { state, dispatch } = app;
  const t = state.templates.find((x) => x.id === id);
  const [stars, setStars] = useState(0);
  const [cm, setCm] = useState("");
  if (!t) return null;
  const mine = t.creatorId === state.user.id, own = owns(state, state.user.id, t);
  const revs = state.reviews.filter((r) => r.templateId === t.id);
  const rated = revs.some((r) => r.userId === state.user.id);
  const scenes = t.sceneStructure.map((s, i) => ({ id: "ps" + i, label: s.label, durationSec: Math.min(s.durationSec, 4), text: s.label + ": " + (t.description || "").split(".")[0].slice(0, 50), referenceImages: [GRADS[(t.g + i) % 8]] }));
  const fee = pct(t.priceCredits, state.settings.marketplaceFeePct);
  const canView = t.moderationStatus === "approved" || mine || state.user.isAdmin;
  const rate = () => {
    if (!stars) { app.toast("Escolha de 1 a 5 estrelas.", "err"); return; }
    act(app, (s) => { const n = t.ratingCount + 1; return { reviews: [{ id: uid(), templateId: t.id, userId: s.user.id, userName: s.user.name, stars, comment: cm.trim(), createdAt: nowISO() }, ...s.reviews], templates: s.templates.map((x) => (x.id === t.id ? { ...x, ratingAvg: Math.round(((x.ratingAvg * x.ratingCount + stars) / n) * 10) / 10, ratingCount: n } : x)) }; });
    setStars(0); setCm(""); app.toast("Avaliação enviada");
  };
  return html`<div className="overlay">
    <${OvTop} title=${t.name} sub=${"por @" + t.creatorId.replace("c-", "") + " · " + t.category} onClose=${() => closeOv(app)} />
    <div className="scroll">${!canView ? html`<${Empty} icon="tag" title="Template indisponível" text="Este template ainda não foi aprovado." />` : html`<div className="stack">
      <div style=${{ display: "flex", justifyContent: "center" }}><div style=${{ width: 190, height: 330 }}><${Player} scenes=${scenes} settings=${{ caption: t.captionStyle }} plan="pro" /></div></div>
      <div className="row" style=${{ gap: 8, flexWrap: "wrap" }}>${t.ratingCount > 0 ? html`<${Stars} v=${t.ratingAvg} /><b className="small">${t.ratingAvg}</b><span className="muted small">(${t.ratingCount} avaliações)</span>` : html`<span className="muted small">Sem avaliações ainda</span>`}<span className="muted small">· ${t.usageCount} usos</span>${t.moderationStatus !== "approved" && html`<${Badge} k=${t.moderationStatus === "pending" ? "review" : t.moderationStatus} />`}</div>
      <p className="small">${t.description}</p>
      <div className="chips">${t.tags.map((g) => html`<span key=${g} className="pill2">#${g}</span>`)}</div>
      <div className="card stack" style=${{ gap: 8 }}><b>Estrutura de cenas</b>${t.sceneStructure.map((s, i) => html`<div className="row small" key=${i}><span className="pill2">${i + 1}</span><span style=${{ flex: 1 }}>${s.label}</span><span className="muted">${s.durationSec}s · ${s.referenceMode === "both" ? "produto + pessoa" : s.referenceMode === "person" ? "pessoa" : "produto"}</span></div>`)}</div>
      <div className="card stack" style=${{ gap: 6 }}><b>Dicas de prompt</b>${t.promptHints.map((h, i) => html`<div className="small muted" key=${i}>• ${h}</div>`)}<div className="small">Voz <b>${t.voiceId}</b> · Trilha <b>${t.trackId}</b> · Legenda <b>${t.captionStyle}</b></div></div>
      ${t.moderationStatus === "rejected" && html`<div className="card badge-err small">Rejeitado: ${t.rejectionReason}</div>`}
      ${t.moderationStatus === "approved" && (own ? html`<button className="btn btn-primary btn-block" onClick=${() => applyTemplate(app, t)}><${Icon} n="layers" size=${18} /> Usar este template</button>`
        : html`<div className="card small muted">Preço ${t.priceCredits} créditos: o criador recebe ${t.priceCredits - fee} e o NexusReel retém ${fee} (${state.settings.marketplaceFeePct}%).</div><button className="btn btn-primary btn-block" onClick=${() => buyTemplate(app, t)}><${Icon} n="dollar" size=${18} /> Comprar por ${t.priceCredits} créditos</button>`)}
      <div className="h2">Avaliações</div>
      ${revs.length === 0 && html`<p className="muted small">Ninguém avaliou ainda.</p>`}
      ${revs.map((r) => html`<div className="row" key=${r.id} style=${{ alignItems: "flex-start" }}><div className="avatar" style=${{ width: 34, height: 34 }}>${(r.userName || "?")[0].toUpperCase()}</div><div style=${{ flex: 1, minWidth: 0 }}><div className="row" style=${{ gap: 8 }}><b className="small">${r.userName}</b><${Stars} v=${r.stars} size=${12} /></div><div className="small">${r.comment}</div></div></div>`)}
      ${own && !mine && !rated && t.moderationStatus === "approved" && html`<div className="card stack" style=${{ gap: 8 }}><b className="small">Sua avaliação</b><div className="row" style=${{ gap: 4 }}>${[1, 2, 3, 4, 5].map((i) => html`<button key=${i} className="tap" aria-label=${i + " estrelas"} aria-pressed=${stars === i} style=${{ fontSize: 28, minWidth: 44, minHeight: 44, color: i <= stars ? "#FBBF24" : "#3a3a44" }} onClick=${() => setStars(i)}>★</button>`)}</div><input className="input" aria-label="Comentário" placeholder="Comentário (opcional)" value=${cm} onChange=${(e) => setCm(e.target.value)} /><button className="btn btn-ghost" onClick=${rate}>Enviar avaliação</button></div>`}
    </div>`}</div></div>`;
}

function TemplateWizard({ editId }) {
  const app = useApp();
  const { state, dispatch } = app;
  const ex = editId && state.templates.find((x) => x.id === editId);
  const bases = state.projects.filter((p) => p.scenes && p.scenes.length && p.status !== "template");
  const [n, setN] = useState(1);
  const [d, setD] = useState(() => ex ? { pid: null, name: ex.name, desc: ex.description, cat: ex.category, tags: ex.tags.join(", "), price: String(ex.priceCredits), g: ex.g, voice: ex.voiceId, track: ex.trackId, cap: ex.captionStyle, hints: ex.promptHints.join("\n"), scenes: ex.sceneStructure } : { pid: null, name: "", desc: "", cat: TPL_CATS[0], tags: "", price: "30", g: 0, voice: VOICE_OPTS[0], track: TRACK_OPTS[0], cap: CAPTIONS[0], hints: "", scenes: [] });
  const set = (p) => setD((x) => ({ ...x, ...p }));
  const pick = (p) => set({ pid: p.id, name: d.name || p.title, desc: d.desc || p.script, scenes: p.scenes.map((s) => ({ label: s.label, durationSec: s.durationSec, referenceMode: s.referenceMode })), voice: (p.settings && p.settings.voice) || d.voice, track: (p.settings && p.settings.track) || d.track, cap: (p.settings && p.settings.caption) || d.cap, hints: d.hints || (HINTS[d.cat] || []).join("\n") });
  const close = () => closeOv(app);
  if (state.user.plan === "free") return html`<div className="overlay"><${OvTop} title="Publicar template" onClose=${close} /><div className="scroll"><${Empty} icon="star" title="Recurso do plano Pro" text="Publicar templates e ganhar créditos exige o plano Pro ou Business." cta="Ver planos" onCta=${() => dispatch({ type: "overlay", overlay: { type: "paywall" } })} /></div></div>`;
  if (!isOn(state, "template_publishing")) return html`<div className="overlay"><${OvTop} title="Publicar template" onClose=${close} /><div className="scroll"><${Empty} icon="tag" title="Publicação desativada" text="O administrador pausou novos templates." /></div></div>`;
  const price = parseInt(d.price, 10);
  const valid = [() => d.scenes.length >= 3, () => d.name.trim().length >= 3 && d.desc.trim().length >= 10 && price >= 0 && price <= 500, () => true, () => true];
  const preview = { id: editId || "new", name: d.name || "Seu template", category: d.cat, g: d.g, creatorId: "c-" + state.user.name, ratingAvg: 0, ratingCount: 0, usageCount: 0, priceCredits: price >= 0 ? price : 0, tags: [] };
  const submit = () => {
    const rec = { name: d.name.trim(), category: d.cat, description: d.desc.trim(), tags: d.tags.split(",").map((x) => x.trim().replace(/^#/, "")).filter(Boolean), g: d.g, previewUrl: GRADS[d.g], sceneStructure: d.scenes, promptHints: d.hints.split("\n").map((x) => x.trim()).filter(Boolean), voiceId: d.voice, trackId: d.track, captionStyle: d.cap, priceCredits: price, moderationStatus: "pending", rejectionReason: undefined };
    act(app, (s) => ex ? { templates: s.templates.map((x) => (x.id === ex.id ? { ...x, ...rec } : x)) } : { templates: [{ id: "t-" + uid(), creatorId: s.user.id, ratingAvg: 0, ratingCount: 0, usageCount: 0, createdAt: nowISO(), ...rec }, ...s.templates] });
    app.toast("Enviado para moderação. Você será avisado da decisão.");
    dispatch({ type: "overlay", overlay: { type: "mytpls" } });
  };
  return html`<div className="overlay"><${OvTop} title=${ex ? "Editar template" : "Publicar template"} sub=${"Etapa " + n + " de 4"} onClose=${close} />
    <div className="scroll"><${Steps} n=${n} labels=${["Projeto", "Dados", "Estrutura", "Revisar"]} />
    <div className="stack" style=${{ gap: 12 }}>
      ${n === 1 && html`<p className="small muted">Escolha um projeto seu para pré-preencher a estrutura de cenas.</p>
        ${bases.length === 0 && html`<${Empty} icon="film" title="Nenhum projeto ainda" text="Crie um vídeo primeiro para transformá-lo em template." cta="Criar vídeo" onCta=${() => dispatch({ type: "tab", tab: "create" })} />`}
        ${bases.map((p) => html`<button key=${p.id} className=${"card row tap " + (d.pid === p.id ? "selcard" : "")} style=${{ textAlign: "left", gap: 12 }} aria-pressed=${d.pid === p.id} onClick=${() => pick(p)}><div style=${{ width: 44, height: 62, borderRadius: 10, background: p.scenes[0].referenceImages[0], flex: "none" }}></div><div style=${{ flex: 1, minWidth: 0 }}><b>${p.title}</b><div className="muted small">${p.scenes.length} cenas · ${p.status === "ready" ? "pronto" : "rascunho"}</div></div>${d.pid === p.id && html`<${Icon} n="check" size=${20} style=${{ color: "var(--ok)" }} />`}</button>`)}
        ${ex && d.scenes.length > 0 && html`<p className="small muted">Estrutura atual mantida (${d.scenes.length} cenas).</p>`}`}
      ${n === 2 && html`<div className="field"><label className="label" htmlFor="tw-name">Nome</label><input id="tw-name" className="input" value=${d.name} onChange=${(e) => set({ name: e.target.value })} /></div>
        <div className="field"><label className="label" htmlFor="tw-desc">Descrição</label><textarea id="tw-desc" className="input" rows="3" value=${d.desc} onChange=${(e) => set({ desc: e.target.value })}></textarea></div>
        <div className="row" style=${{ alignItems: "flex-start" }}><div className="field" style=${{ flex: 1 }}><label className="label" htmlFor="tw-cat">Categoria</label><select id="tw-cat" className="input" value=${d.cat} onChange=${(e) => set({ cat: e.target.value })}>${TPL_CATS.map((c) => html`<option key=${c}>${c}</option>`)}</select></div>
          <div className="field" style=${{ width: 120 }}><label className="label" htmlFor="tw-price">Preço (cr)</label><input id="tw-price" className="input" type="number" min="0" max="500" value=${d.price} onChange=${(e) => set({ price: e.target.value })} /></div></div>
        <div className="field"><label className="label" htmlFor="tw-tags">Tags (separadas por vírgula)</label><input id="tw-tags" className="input" placeholder="skincare, rotina" value=${d.tags} onChange=${(e) => set({ tags: e.target.value })} /></div>
        <div className="field"><span className="label">Capa</span><div className="chips" data-noswipe>${GRADS.map((g, i) => html`<button key=${i} aria-label=${"Capa " + (i + 1)} aria-pressed=${d.g === i} className="tap" style=${{ width: 44, height: 44, borderRadius: 12, background: g, flex: "none", border: d.g === i ? "3px solid #fff" : "3px solid transparent" }} onClick=${() => set({ g: i })}></button>`)}</div></div>
        ${price > 0 && html`<p className="small muted">Você recebe ${price - pct(price, state.settings.marketplaceFeePct)} créditos por venda (${100 - state.settings.marketplaceFeePct}%).</p>`}`}
      ${n === 3 && html`<div className="card stack" style=${{ gap: 6 }}><b>Cenas (${d.scenes.length})</b>${d.scenes.map((s, i) => html`<div className="row small" key=${i}><span className="pill2">${i + 1}</span><span style=${{ flex: 1 }}>${s.label}</span><span className="muted">${s.durationSec}s</span></div>`)}</div>
        <div className="row" style=${{ gap: 8 }}>${[["Voz", "voice", VOICE_OPTS], ["Trilha", "track", TRACK_OPTS], ["Legenda", "cap", CAPTIONS]].map(([l, k, o]) => html`<div className="field" style=${{ flex: 1, minWidth: 0 }} key=${k}><label className="label" htmlFor=${"tw-" + k}>${l}</label><select id=${"tw-" + k} className="input" value=${d[k]} onChange=${(e) => set({ [k]: e.target.value })}>${o.map((v) => html`<option key=${v}>${v}</option>`)}</select></div>`)}</div>
        <div className="field"><label className="label" htmlFor="tw-hints">Dicas de prompt (uma por linha)</label><textarea id="tw-hints" className="input" rows="4" value=${d.hints} onChange=${(e) => set({ hints: e.target.value })}></textarea></div>`}
      ${n === 4 && html`<p className="small muted">Assim seu template aparecerá no marketplace:</p><div style=${{ maxWidth: 200 }}><${TplCard} t=${preview} onOpen=${() => {}} /></div>
        <div className="card small stack" style=${{ gap: 4 }}><div><b>${d.name}</b> · ${d.cat} · ${price} créditos</div><div className="muted">${d.scenes.length} cenas · voz ${d.voice} · trilha ${d.track} · legenda ${d.cap}</div></div>
        <p className="small muted">O template vai para a fila de moderação do NexusReel. Status: rascunho → em análise → aprovado ou rejeitado.</p>`}
      ${valid[n - 1]() ? null : html`<p className="small badge-err">${n === 1 ? "Escolha um projeto com pelo menos 3 cenas." : "Nome (3+), descrição (10+) e preço de 0 a 500."}</p>`}
      <div className="row" style=${{ gap: 10 }}>${n > 1 && html`<button className="btn btn-ghost" style=${{ flex: 1 }} onClick=${() => setN(n - 1)}>Voltar</button>`}${n < 4 ? html`<button className="btn btn-primary" style=${{ flex: 1 }} disabled=${!valid[n - 1]()} onClick=${() => setN(n + 1)}>Continuar</button>` : html`<button className="btn btn-primary" style=${{ flex: 1 }} onClick=${submit}>Enviar para moderação</button>`}</div>
    </div></div></div>`;
}
function MyTemplates() {
  const app = useApp();
  const { state, dispatch } = app;
  const mine = state.templates.filter((t) => t.creatorId === state.user.id);
  const sales = (t) => state.purchases.filter((p) => p.templateId === t.id);
  const earned = (t) => sales(t).reduce((a, p) => a + p.creatorShareCredits, 0);
  const total = mine.reduce((a, t) => a + earned(t), 0);
  const set = (t, status) => { act(app, (s) => ({ templates: s.templates.map((x) => (x.id === t.id ? { ...x, moderationStatus: status } : x)) })); app.toast(status === "draft" ? "Template despublicado" : "Enviado para análise"); };
  const badge = (t) => html`<${Badge} k=${t.moderationStatus === "pending" ? "review" : t.moderationStatus} />`;
  return html`<div className="overlay"><${OvTop} title="Meus templates" sub=${mine.length + " template(s) · " + total + " créditos ganhos"} onClose=${() => closeOv(app)} />
    <div className="scroll"><div className="stack">
      <button className="btn btn-primary btn-block" onClick=${() => dispatch({ type: "overlay", overlay: { type: "tplwiz" } })}><${Icon} n="plus" size=${18} /> Publicar novo template</button>
      ${mine.length === 0 ? html`<${Empty} icon="tag" title="Nenhum template publicado" text="Transforme um vídeo seu em template e ganhe créditos a cada venda." />` : html`<${Tbl} rows=${mine} rowKey=${(t) => t.id} cols=${[
        { k: "n", label: "Template", v: (t) => t.name, r: (t) => html`<span><b>${t.name}</b>${t.rejectionReason ? html`<div className="small badge-err">Motivo: ${t.rejectionReason}</div>` : null}</span>` },
        { k: "s", label: "Status", v: (t) => t.moderationStatus, r: badge },
        { k: "v", label: "Vendas", v: (t) => sales(t).length }, { k: "g", label: "Ganhos (cr)", v: earned },
        { k: "a", label: "Nota", v: (t) => t.ratingAvg, r: (t) => (t.ratingCount ? t.ratingAvg + " ★ (" + t.ratingCount + ")" : "—") },
        { k: "ac", label: "Ações", nosort: true, r: (t) => html`<span className="row" style=${{ gap: 6, flexWrap: "wrap" }}><button className="btn btn-ghost btn-sm" onClick=${() => dispatch({ type: "overlay", overlay: { type: "tplwiz", editId: t.id } })}>Editar</button>${t.moderationStatus === "approved" || t.moderationStatus === "pending" ? html`<button className="btn btn-ghost btn-sm" onClick=${() => set(t, "draft")}>Despublicar</button>` : html`<button className="btn btn-ghost btn-sm" onClick=${() => set(t, "pending")}>Reenviar</button>`}</span>` },
      ]} />`}
    </div></div></div>`;
}

function AffConfig() {
  const app = useApp();
  const { state } = app;
  const [sheet, setSheet] = useState(null);
  const [busy, setBusy] = useState(false);
  const acc = (id) => state.affAccounts.find((a) => a.userId === state.user.id && a.platform === id);
  const connect = async () => {

function splitCsv(text) {

function parseCatalogCsv(text, maxRows = 500) {
  const out = { items: [], errors: [], warnings: [] };
  const rows = splitCsv(text.replace(/^﻿/, ""));
  if (!rows.length) { out.errors.push({ line: 1, message: "Arquivo vazio." }); return out; }
  const cols = rows[0].map((h) => CSV_ALIAS[normS(h).replace(/\[\]$/, "")] || normS(h));
  ["name", "price"].forEach((r) => { if (!cols.includes(r)) out.errors.push({ line: 1, message: "Coluna obrigatória ausente: " + (r === "name" ? "nome" : "preco") + "." }); });
  if (out.errors.length) return out;
  if (rows.length - 1 > maxRows) out.errors.push({ line: 1, message: "Máximo de " + maxRows + " produtos por catálogo." });
  const seen = new Set();
  rows.slice(1, maxRows + 1).forEach((r, i) => {
    const line = i + 2, g = (k) => (r[cols.indexOf(k)] || "").trim();
    const name = g("name"), price = parsePrice(g("price")); let sku = g("sku");
    if (!name) { out.errors.push({ line, message: "Nome vazio." }); return; }
    if (!(price > 0)) { out.errors.push({ line, message: 'Preço inválido: "' + g("price") + '".' }); return; }
    if (!sku) { sku = "SKU-" + String(i + 1).padStart(3, "0"); out.warnings.push({ line, message: "SKU vazio; gerado " + sku + "." }); }
    if (seen.has(sku)) { out.errors.push({ line, message: "SKU duplicado: " + sku + "." }); return; }
    seen.add(sku);
    const rc = g("category"), cat = CSV_CAT[normS(rc)];
    if (!cat) out.warnings.push({ line, message: 'Categoria "' + rc + '" desconhecida; usando ' + CATEGORIES[0] + "." });

  });

}

/* ========================================================================

function Admin() {
  const app = useApp();
  const { state } = app;
  const [tab, setTab] = useState("sum");
  const [cf, setCf] = useState(null);
  const [q, setQ] = useState("");
  const [planF, setPlanF] = useState("all");
  const [okId, setOkId] = useState(null);
  const [cfg, setCfg] = useState(null);

  const users = allUsers(state), st = state.settings;
  const mrr = users.filter((u) => !u.banned).reduce((a, u) => a + PLAN_PRICE[u.plan], 0);

  const pendPay = state.payouts.filter((p) => p.status === "pending" || p.status === "approved");
  const openDis = state.disputes.filter((d) => d.status === "open");
  const log = (action, target, detail) => (s) => auditE(s, action, target, detail);

  const saveCfg = () => confirm({ title: "Salvar configurações", body: "As novas taxas e limites valem imediatamente para todos.", label: "Salvar", run: () => { act(app, (s) => ({ settings: { ...s.settings, marketplaceFeePct: +cfg.mkt, affiliateFeePct: +cfg.aff, minPayoutCents: Math.round(+cfg.min * 100), planLimits: { free: +cfg.lf, pro: +cfg.lp, business: +cfg.lb } }, ...auditE(s, "settings.update", "taxas e limites", "mkt " + cfg.mkt + "% · afil " + cfg.aff + "% · saque mín. R$ " + cfg.min) })); setCfg(null); app.toast("Configurações salvas"); } });

  const setC = (p) => setCfg({ ...cfgV, ...p });

  const tplRow = (t) => html`<div className="card stack" key=${t.id} style=${{ gap: 8 }}><div className="row" style=${{ alignItems: "flex-start", gap: 12 }}><div style=${{ width: 54, height: 76, borderRadius: 12, background: GRADS[t.g], flex: "none", display: "grid", placeItems: "center" }}>${okId === t.id && html`<span className="bigcheck" style=${{ width: 40, height: 40 }}><${Icon} n="check" size=${24} sw=${3} /></span>`}</div>
    <div style=${{ flex: 1, minWidth: 0 }}><b>${t.name}</b><div className="muted small">por @${t.creatorId.replace("c-", "")} · ${t.category} · ${t.priceCredits} cr · ${t.sceneStructure.length} cenas</div><div className="small" style=${{ marginTop: 4 }}>${t.description}</div></div><${Badge} k=${t.moderationStatus === "pending" ? "review" : t.moderationStatus} /></div>

      <div className="chips" data-noswipe>${[["sum", "Resumo"], ["users", "Usuários"], ["tpls", "Templates (" + pendTpl.length + ")"], ["pubs", "Publicações (" + openRep.length + ")"], ["fin", "Financeiro"], ["cfg", "Configurações"]].map(([k, l]) => html`<button key=${k} className=${"chip tap " + (tab === k ? "on" : "")} onClick=${() => setTab(k)}>${l}</button>`)}</div>

        <${Tbl} rows=${fu} rowKey=${(u) => u.id} cols=${[
          { k: "n", label: "Usuário", v: (u) => u.name, r: (u) => html`<span><b>${u.name}</b>${u.isAdmin ? " (admin)" : ""}<div className="muted small">${u.email}</div></span>` },

        <div className="h2">Saques</div>${state.payouts.length === 0 ? html`<p className="muted small">Nenhum saque.</p>` : state.payouts.map((p) => html`<div className="card stack" key=${p.id} style=${{ gap: 6 }}><div className="row"><b style=${{ flex: 1 }}>${money(p.amountCents)} · ${userName(state, p.userId)}</b><${Badge} k=${p.status} /></div>${p.reason && html`<div className="small badge-err">${p.reason}</div>`}${(p.status === "pending" || p.status === "approved") && html`<div className="row" style=${{ gap: 8, flexWrap: "wrap" }}>${p.status === "pending" && html`<button className="btn btn-primary btn-sm" onClick=${() => payAct(p, "approved")}>Aprovar</button>`}<button className="btn btn-ghost btn-sm" onClick=${() => payAct(p, "paid")}>Marcar pago</button><button className="btn btn-ghost btn-sm" onClick=${() => payAct(p, "rejected")}>Rejeitar</button></div>`}</div>`)}
        <div className="h2">Disputas</div>${state.disputes.map((d) => html`<div className="card stack" key=${d.id} style=${{ gap: 6 }}><div className="row"><b style=${{ flex: 1 }}>${userName(state, d.buyerId)}</b><${Badge} k=${d.status} /></div><div className="small muted">${d.reason}</div>${d.status === "open" && html`<div className="row" style=${{ gap: 8 }}><button className="btn btn-ghost btn-sm" style=${{ flex: 1 }} onClick=${() => disAct(d, "refunded")}>Reembolsar</button><button className="btn btn-ghost btn-sm" style=${{ flex: 1 }} onClick=${() => disAct(d, "denied")}>Negar</button></div>`}</div>`)}`}
      ${tab === "cfg" && html`<div className="card stack" style=${{ gap: 10 }}><b>Taxas e limites</b>
        ${[["Comissão do marketplace (%)", "mkt", "cf-mkt"], ["Comissão de afiliados retida (%)", "aff", "cf-aff"], ["Saque mínimo (R$)", "min", "cf-min"], ["Limite Free (vídeos/mês)", "lf", "cf-lf"], ["Limite Pro", "lp", "cf-lp"], ["Limite Business", "lb", "cf-lb"]].map(([l, k, id]) => html`<div className="field" key=${k}><label className="label" htmlFor=${id}>${l}</label><input id=${id} className="input" type="number" min="0" value=${cfgV[k]} onChange=${(e) => setC({ [k]: e.target.value })} /></div>`)}

    </div></div>
    ${cf && html`<${Confirm} title=${cf.title} body=${cf.body} label=${cf.label} danger=${cf.danger} reason=${cf.reason} onConfirm=${(r) => cf.run(r)} onClose=${() => setCf(null)} />`}
  </div>`;
}

/* ---- Contas conectadas (OAuth 2.0 simulado) ---- */
function OAuthSheet({ p, reconnect, onClose }) {
  const app = useApp();
  const [phase, setPhase] = useState("consent");
  const [err, setErr] = useState(null);
  const alive = useRef(true);
  useEffect(() => () => { alive.current = false; }, []);
  const authorize = async () => {
    setPhase("working"); ilog(p.id, "oauth_start", { pkce: "S256" });
    try {
      const t = await INTEGRATIONS[p.id].connect();
      app.dispatch({ type: "addAccount", account: { id: uid(), platform: p.id, handle: t.handle, connectedAt: nowISO(), lastSyncAt: nowISO(), expiresAt: t.expiresAt, accessToken: t.accessToken, refreshToken: t.refreshToken, status: "connected" } });

      if (alive.current) setPhase("done");

      if (alive.current) onClose();
    } catch (e) { if (alive.current) { setErr("Não foi possível conectar. Tente novamente."); setPhase("consent"); } }

  [/est[uú]dio|studio|branco|white|blanco/, ["#ffffff", "#f0f0f0", "#dedede"]], [/natureza|jardim|garden|floresta|forest/, ["#b7d7a8", "#6aa36f", "#2f6b3f"]], [/noite|night|neon|festa|party/, ["#1b1035", "#6b2fb3", "#e0428c"]]];

function BgLook({ base, look }) {
  if (!look) return html`<div className="bg-layer" style=${{ background: base }}></div>`;
  if (look.kind === "element") return html`<div className="bg-layer"><${BgLook} base=${base} look=${look.from} /><div className="el-item" data-eltype=${look.el.type} style=${{ left: look.el.x * 100 + "%", top: look.el.y * 100 + "%", height: look.el.scale * 100 + "%", background: look.el.photo }}></div></div>`;
  if (look.kind === "recolor") return html`<div className="bg-layer"><${BgLook} base=${base} look=${look.from} /><div className="el-tint" style=${{ ...pctBox(look.box), background: "hsl(" + look.hue + " 80% 50%)" }}></div></div>`;
  if (look.kind === "erase") return html`<div className="bg-layer"><${BgLook} base=${base} look=${look.from} /><div className="el-erase" style=${pctBox(look.box)}></div></div>`;
  if (look.kind === "outpaint") return html`<div className="bg-layer"><div className="bg-extend" style=${{ background: base }}></div>
    <div style=${{ position: "absolute", top: 0, bottom: 0, left: "50%", transform: "translateX(-50%)", aspectRatio: "9/16", overflow: "hidden" }}><div className="bg-stage" style=${{ height: "100%", maxWidth: "none", borderRadius: 0 }}><${BgLook} base=${base} look=${look.from} /></div></div></div>`;
  const back = look.kind === "remove" ? html`<div className="bg-layer bg-check"></div>` : html`<div className="bg-layer" style=${{ background: look.photo || "linear-gradient(160deg," + look.palette.join(",") + ")" }}></div>`;

}
